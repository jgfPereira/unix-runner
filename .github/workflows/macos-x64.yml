name: macOS x64 Machine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-x64:
    runs-on: macos-26-intel
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      SHELL: /bin/zsh

    steps:
      - name: Verify macOS architecture and bootstrap OpenSSL
        run: |
          set -euo pipefail

          actual_arch="$(uname -m)"
          if [[ "$actual_arch" != "x86_64" ]]; then
            echo "::error::Expected x86_64 but runner is $actual_arch"
            exit 1
          fi
          command -v brew >/dev/null || {
            echo "::error::Homebrew is missing from the macOS runner"
            exit 1
          }

          openssl_bin="$(brew --prefix openssl@3)/bin/openssl"
          if [[ ! -x "$openssl_bin" ]]; then
            brew install openssl@3
          fi
          openssl_bin="$(brew --prefix openssl@3)/bin/openssl"
          [[ -x "$openssl_bin" ]] || {
            echo "::error::OpenSSL 3 installation failed"
            exit 1
          }
          "$openssl_bin" version
          echo "$(dirname "$openssl_bin")" >> "$GITHUB_PATH"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Download encrypted payload from GitHub Release
        run: |
          set -euo pipefail
          release_tag="runner-payload"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/payload.zip.enc"

          curl --fail --location --show-error --silent --retry 3 --retry-delay 5 \
            --output payload.zip.enc.download "$download_url"
          test -s payload.zip.enc.download
          mv -f payload.zip.enc.download payload.zip.enc

      - name: Decrypt and test encrypted payload
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${ZIP_PASSWORD:-}" ]]; then
            echo "::error::Repository secret ZIP_PASSWORD is missing or empty"
            exit 1
          fi
          [[ -s payload.zip.enc ]] || {
            echo "::error::payload.zip.enc does not exist or is empty"
            exit 1
          }

          "$(brew --prefix openssl@3)/bin/openssl" enc \
            -aes-256-cbc -d -pbkdf2 \
            -in payload.zip.enc \
            -out payload.zip \
            -pass env:ZIP_PASSWORD

          unzip -tqq payload.zip

      - name: Extract payload to workspace
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/extracted_files"
          unzip -q payload.zip -d "$GITHUB_WORKSPACE/extracted_files"

          if [[ -z "$(find "$GITHUB_WORKSPACE/extracted_files" -mindepth 1 -print -quit)" ]]; then
            echo "::error::Encrypted payload extracted no files"
            exit 1
          fi
          echo "Extracted payload into: $GITHUB_WORKSPACE/extracted_files"

      - name: Install native macOS build dependencies
        run: |
          set -euo pipefail
          # Go from Homebrew is current; no manual Go tarball is necessary.
          # Zsh completion is built into macOS; bash-completion supports Bash 3.2.
          brew install maven go python imagemagick bash-completion

      - name: Install and configure Oracle JDK 25 (x64)
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/oracle-jdk-25-x86_64.tar.gz"
          url="https://download.oracle.com/java/25/latest/jdk-25_macos-x64_bin.tar.gz"

          curl --fail --location --show-error --silent --retry 3 \
            --retry-delay 3 --output "$archive" "$url"
          tar -tzf "$archive" >/dev/null

          install_root="$HOME/Library/Java/JavaVirtualMachines"
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root"
          rm -f "$archive"

          jdk_bundle="$(find "$install_root" -maxdepth 1 -type d -name 'jdk-25*.jdk' -print -quit)"
          if [[ -z "$jdk_bundle" ]]; then
            echo "::error::Oracle archive did not contain a JDK 25 .jdk bundle"
            exit 1
          fi
          java_home="$jdk_bundle/Contents/Home"
          for tool in java javac jpackage jlink; do
            [[ -x "$java_home/bin/$tool" ]] || {
              echo "::error::Missing $tool in Oracle JDK: $java_home"
              exit 1
            }
          done

          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"

          "$java_home/bin/java" -version
          "$java_home/bin/javac" -version
          "$java_home/bin/jpackage" --version

      - name: Verify toolchains and macOS packaging utilities
        run: |
          set -euo pipefail
          echo "Architecture: $(uname -m)"
          echo "Runner: $(sw_vers -productVersion)"
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          javac -version
          jpackage --version
          jlink --version
          mvn -version
          go version
          python3 --version
          magick -version | sed -n '1,2p'
          "$(brew --prefix openssl@3)/bin/openssl" version
          zip -v | sed -n '1,2p'
          unzip -v | sed -n '1,2p'

          for tool in file codesign hdiutil ditto iconutil sips pkgbuild productbuild xcrun; do
            command -v "$tool" >/dev/null || {
              echo "::error::Required macOS utility missing: $tool"
              exit 1
            }
          done
          xcrun --find clang

      - name: Configure interactive Zsh and Bash sessions
        run: |
          set -euo pipefail

          brew_prefix="$(brew --prefix)"
          openssl_prefix="$(brew --prefix openssl@3)"
          {
            printf 'export JAVA_HOME="%s"\n' "$JAVA_HOME"
            printf 'export PATH="$JAVA_HOME/bin:%s/bin:%s/bin:$PATH"\n' "$brew_prefix" "$openssl_prefix"
            printf 'export CLICOLOR=1\n'
          } > "$HOME/.unix-runner-env"

          cat >> "$HOME/.zprofile" <<'EOF'
          [[ -f "$HOME/.unix-runner-env" ]] && source "$HOME/.unix-runner-env"
          EOF

          cat >> "$HOME/.zshrc" <<'EOF'
          [[ -f "$HOME/.unix-runner-env" ]] && source "$HOME/.unix-runner-env"
          [[ -o interactive ]] || return
          export TERM="${TERM:-xterm-256color}"
          HISTFILE="$HOME/.zsh_history"
          HISTSIZE=10000
          SAVEHIST=20000
          setopt HIST_IGNORE_DUPS HIST_REDUCE_BLANKS SHARE_HISTORY
          autoload -Uz colors compinit
          colors
          compinit -i
          PROMPT='%B%F{green}mac%f%b:%F{blue}%1~%f %# '
          alias ls='ls -G'
          alias ll='ls -alFG'
          alias la='ls -AG'
          alias l='ls -CFG'
          if echo test | grep --color=auto test >/dev/null 2>&1; then
            alias grep='grep --color=auto'
          fi
          EOF

          cat >> "$HOME/.bashrc" <<'EOF'
          [[ -f "$HOME/.unix-runner-env" ]] && source "$HOME/.unix-runner-env"
          case "$-" in *i*) ;; *) return ;; esac
          export TERM="${TERM:-xterm-256color}"
          HISTCONTROL=ignoreboth:erasedups
          HISTSIZE=10000
          HISTFILESIZE=20000
          shopt -s checkwinsize
          PS1='\[\033[1;32m\]mac\[\033[0m\]:\[\033[1;34m\]\W\[\033[0m\]\$ '
          alias ls='ls -G'
          alias ll='ls -alFG'
          alias la='ls -AG'
          alias l='ls -CFG'
          if echo test | grep --color=auto test >/dev/null 2>&1; then
            alias grep='grep --color=auto'
          fi
          if [[ -f "$HOME/.unix-runner-env" ]] && command -v brew >/dev/null; then
            bash_completion="$(brew --prefix)/etc/bash_completion"
            [[ ! -f "$bash_completion" ]] || source "$bash_completion"
          fi
          EOF

          cat >> "$HOME/.bash_profile" <<'EOF'
          [[ -f "$HOME/.bashrc" ]] && source "$HOME/.bashrc"
          EOF

          for shell_file in "$HOME/.bashrc" "$HOME/.bash_profile"; do
            /bin/bash -n "$shell_file"
          done
          for shell_file in "$HOME/.zshrc" "$HOME/.zprofile"; do
            /bin/zsh -n "$shell_file"
          done

      - name: Configure SSH keepalive for Upterm
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          cat >> "$HOME/.ssh/config" <<'EOF'
          Host uptermd.upterm.dev
              ServerAliveInterval 30
              ServerAliveCountMax 3
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Start secure interactive SSH session
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-users: 'jgfPereira'

      - name: Package and encrypt staged artifact
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          set -euo pipefail

          staging_dir="$GITHUB_WORKSPACE/artifact"
          if [[ ! -d "$staging_dir" ]] || [[ -z "$(find "$staging_dir" -mindepth 1 \( -type f -o -type l \) -print -quit)" ]]; then
            echo "::warning::No build artifact found in artifact/; skipping upload."
            exit 0
          fi

          if [[ -z "${ZIP_PASSWORD:-}" ]]; then
            echo "::error::Repository secret ZIP_PASSWORD is missing or empty."
            exit 1
          fi

          plain_zip="$RUNNER_TEMP/artifact.zip"
          encrypted_zip="$GITHUB_WORKSPACE/artifact.zip.enc"
          trap 'rm -f "$plain_zip"' EXIT

          (cd "$staging_dir" && zip -qry "$plain_zip" .)
          "$(brew --prefix openssl@3)/bin/openssl" enc -aes-256-cbc -salt -pbkdf2 \
            -in "$plain_zip" \
            -out "$encrypted_zip" \
            -pass env:ZIP_PASSWORD

          test -s "$encrypted_zip"
          echo "Encrypted build artifact is ready for upload."

      - name: Upload encrypted build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-build
          path: artifact.zip.enc
          if-no-files-found: warn
          compression-level: 0

