name: Linux x64 Machine

on:
  workflow_dispatch:

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 30
    env:
      SHELL: /bin/bash

    steps:
      - name: Install Git, LFS, Unzip, and OpenSSL for Initialization
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git git-lfs unzip openssl

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Decrypt Payload
        run: |
          openssl enc -aes-256-cbc -d -pbkdf2 \
            -in payload.zip.enc \
            -out payload.zip \
            -k "${{ secrets.ZIP_PASSWORD }}"

      - name: Extract Payload
        run: |
          unzip -q payload.zip -d ./extracted_files
          
      - name: Install Required Dependencies
        run: |
          echo "Installing remaining dependencies..."
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y maven python3 zip imagemagick curl ca-certificates binutils bash-completion file desktop-file-utils
          
          echo "Downloading and installing appimagetool..."
          curl -L -o /usr/local/bin/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /usr/local/bin/appimagetool
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> $GITHUB_ENV
          
          echo "Verifying dependency versions..."
          mvn -version
          python3 --version
          zip -v | head -n 2
          unzip -v | head -n 2
          convert -version
          openssl version
          APPIMAGE_EXTRACT_AND_RUN=1 appimagetool --version || echo "appimagetool installed successfully."

      - name: Install Latest Go
        run: |
          echo "Fetching latest Go version..."
          GO_VERSION=$(curl -sL https://go.dev/VERSION?m=text | head -n 1 | tr -d '[:space:]')
          echo "Latest version is $GO_VERSION"
          
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            GO_ARCH="amd64"
          elif [ "$ARCH" = "aarch64" ]; then
            GO_ARCH="arm64"
          else
            GO_ARCH="amd64"
          fi
          
          curl -L -o go.tar.gz "https://dl.google.com/go/${GO_VERSION}.linux-${GO_ARCH}.tar.gz"
          rm -rf /usr/local/go
          tar -C /usr/local -xzf go.tar.gz
          rm go.tar.gz
          
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          export PATH=$PATH:/usr/local/go/bin
          
          go version

      - name: Install and Configure Oracle Java 25
        run: |
          echo "Downloading Oracle JDK 25 for x64..."
          curl -L -o jdk-25.tar.gz "https://download.oracle.com/java/25/latest/jdk-25_linux-x64_bin.tar.gz"
          
          echo "Extracting JDK..."
          mkdir -p /opt/jdk
          tar -xzf jdk-25.tar.gz -C /opt/jdk/
          
          JDK_DIR=$(ls -d /opt/jdk/jdk-25* | head -n 1)
          echo "JDK installed at: $JDK_DIR"
          
          echo "Setting up alternatives and default versions..."
          update-alternatives --install /usr/bin/java java "${JDK_DIR}/bin/java" 1000
          update-alternatives --install /usr/bin/javac javac "${JDK_DIR}/bin/javac" 1000
          
          update-alternatives --set java "${JDK_DIR}/bin/java"
          update-alternatives --set javac "${JDK_DIR}/bin/javac"
          
          echo "Configuring environment variables..."
          echo "JAVA_HOME=${JDK_DIR}" | tee -a /etc/environment
          echo "JAVA_HOME=${JDK_DIR}" >> $GITHUB_ENV
          echo "${JDK_DIR}/bin" >> $GITHUB_PATH
          
          source /etc/environment || true
          
          echo "Verifying Java versions..."
          java -version
          javac -version
          
      - name: Configure Terminal Colors and Completion
        shell: bash
        run: |
          cat << 'EOF' > ~/.bashrc
          
          [ -z "$PS1" ] && return

          HISTCONTROL=ignoreboth:erasedups
          HISTSIZE=10000
          HISTFILESIZE=20000

          shopt -s checkwinsize

          export TERM=xterm-256color
          reset="\[\e[0m\]"
          bold="\[\e[1m\]"
          green="\[\e[32m\]"
          blue="\[\e[34m\]"
          yellow="\[\e[33m\]"

          PS1="${bold}${green}linux${reset}:${bold}${blue}\W${reset}\$ "

          alias ls='ls --color=auto'
          alias ll='ls -alF'
          alias la='ls -A'
          alias l='ls -CF'
          alias grep='grep --color=auto'
          alias fgrep='fgrep --color=auto'
          alias egrep='egrep --color=auto'

          if ! shopt -oq posix; then
            if [ -f /usr/share/bash-completion/bash_completion ]; then
              . /usr/share/bash-completion/bash_completion
            elif [ -f /etc/bash_completion ]; then
              . /etc/bash_completion
            fi
          fi
          EOF

          if ! grep -q ".bashrc" ~/.profile 2>/dev/null; then
            cat << 'EOF' >> ~/.profile

          if [ -f "$HOME/.bashrc" ]; then
              . "$HOME/.bashrc"
          fi
          EOF
          fi

      - name: Configure SSH Keepalive for Upterm
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' >> ~/.ssh/config
          Host uptermd.upterm.dev
              ServerAliveInterval 30
              ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

      - name: Start Secure Interactive SSH Session
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-users: 'jgfPereira'